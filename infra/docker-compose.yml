version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: alepejo-postgres

    restart: unless-stopped

    environment:
      POSTGRES_DB: alepejo
      POSTGRES_USER: alepejo
      POSTGRES_PASSWORD: alepejo123

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alepejo"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: