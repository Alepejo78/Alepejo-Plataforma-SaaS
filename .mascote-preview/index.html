<!doctype html><html><head><meta charset="utf-8"><style>
body { margin:0; background:#eef2f7; font-family:system-ui; }
main { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; padding:14px; }
figure { margin:0; background:#fff; border:1px solid #e2e8f0; border-radius:16px; text-align:center; padding:6px; }
figcaption { font-size:13px; font-weight:700; color:#334155; }
/*
 * Animações do Pejo, o mascote (ver `Mascote.tsx`). Ficam em CSS puro
 * porque são laços infinitos — em JS custariam re-render a cada quadro
 * à toa, e aqui o navegador anima sozinho.
 *
 * Todo grupo que gira usa `transform-box: fill-box`, senão o SVG mede
 * a origem pelo canvas inteiro e o braço sai rodando longe do ombro.
 */

/* Flutua sem pernas: ele é um robô de nuvem, nunca encosta no chão. */
@keyframes pejo-float {
  0%,
  100% {
    transform: translateY(0) rotate(0deg);
  }
  35% {
    transform: translateY(-7px) rotate(-1.2deg);
  }
  70% {
    transform: translateY(-3px) rotate(1.2deg);
  }
}

/* A sombra encolhe quando ele sobe — é o que vende a altura. */
@keyframes pejo-sombra {
  0%,
  100% {
    transform: scaleX(1);
    opacity: 0.16;
  }
  35% {
    transform: scaleX(0.82);
    opacity: 0.1;
  }
}

/* Piscada: fecha o olho num instante e passa a maior parte do ciclo
   aberto — por isso os quadros da piscada ficam espremidos no fim. */
@keyframes pejo-blink {
  0%,
  92%,
  100% {
    transform: scaleY(1);
  }
  95%,
  97% {
    transform: scaleY(0.08);
  }
}

/* Olhar passeando: dá a impressão de que ele está pensando, e é o que
   mais separa "boneco parado" de "personagem vivo". */
@keyframes pejo-olhar {
  0%,
  30%,
  100% {
    transform: translateX(0);
  }
  45%,
  60% {
    transform: translateX(3px);
  }
  75%,
  85% {
    transform: translateX(-3px);
  }
}

@keyframes pejo-antenna {
  0%,
  100% {
    opacity: 1;
    transform: scale(1);
  }
  50% {
    opacity: 0.4;
    transform: scale(0.86);
  }
}

/* O anel de sustentação pulsa em vez de girar: girar uma elipse chata
   em 2D vira uma argola balançando torta, não uma órbita — o efeito de
   antigravidade sai melhor abrindo e fechando de leve. */
@keyframes pejo-anel {
  0%,
  100% {
    transform: scale(1);
    opacity: 0.75;
  }
  50% {
    transform: scale(1.08);
    opacity: 0.4;
  }
}

@keyframes pejo-talk {
  0%,
  100% {
    transform: scaleY(0.55);
  }
  50% {
    transform: scaleY(1.35);
  }
}

@keyframes pejo-wave-arm {
  0%,
  100% {
    transform: rotate(8deg);
  }
  50% {
    transform: rotate(-34deg);
  }
}

@keyframes pejo-hop {
  0%,
  100% {
    transform: translateY(0) rotate(0deg);
  }
  25% {
    transform: translateY(-16px) rotate(-5deg);
  }
  55% {
    transform: translateY(0) rotate(4deg);
  }
  75% {
    transform: translateY(-7px) rotate(0deg);
  }
}

/*
 * Giro que parece giro de verdade, e não foto rodando.
 *
 * `rotateY` sozinho num SVG plano só espelha o desenho — dá pra ver a
 * cara "de trás", ao contrário. O truque aqui é imitar o que a vista
 * faz numa volta real: o corpo ESTREITA até ficar de perfil (quase
 * uma linha), e nesse instante a frente sai de cena e as costas
 * entram. Depois alarga de novo, já de costas, e repete pra voltar à
 * frente. É por isso que são três animações sincronizadas — silhueta,
 * frente e costas — todas com a mesma duração.
 */
@keyframes pejo-spin {
  0% {
    transform: perspective(700px) scaleX(1) rotateY(0deg);
  }
  25% {
    transform: perspective(700px) scaleX(0.34) rotateY(-6deg);
  }
  50% {
    transform: perspective(700px) scaleX(0.06) rotateY(0deg);
  }
  75% {
    transform: perspective(700px) scaleX(0.34) rotateY(6deg);
  }
  100% {
    transform: perspective(700px) scaleX(1) rotateY(0deg);
  }
}

/* A frente some pouco antes do perfil e volta pouco depois. */
@keyframes pejo-frente {
  0%,
  38% {
    opacity: 1;
  }
  46%,
  100% {
    opacity: 0;
  }
}

/* As costas entram no perfil e ficam até o fim da volta. */
@keyframes pejo-costas {
  0%,
  46% {
    opacity: 0;
  }
  54%,
  100% {
    opacity: 1;
  }
}

@keyframes pejo-slump {
  0% {
    transform: translateY(0) rotate(0deg);
  }
  100% {
    transform: translateY(8px) rotate(-4deg);
  }
}

.pejo {
  display: block;
  overflow: visible;
}

/*
 * Pose de três-quartos: o corpo inteiro gira um pouco no mesmo eixo do
 * giro completo, então a silhueta estreita e a luz de contorno dourada
 * passa a pegar de raspão — que é o que dá a impressão de um objeto
 * virado, e não de um desenho inclinado.
 */
.pejo-lado {
  transform: perspective(700px) rotateY(-34deg);
  transform-origin: center;
  transform-box: fill-box;
  transition: transform 0.5s ease-out;
}

.pejo-float {
  animation: pejo-float 4.2s ease-in-out infinite;
}

.pejo-sombra {
  transform-origin: center;
  transform-box: fill-box;
  animation: pejo-sombra 4.2s ease-in-out infinite;
}

.pejo-hop {
  animation: pejo-hop 0.9s ease-in-out 2;
}

.pejo-spin {
  transform-origin: center;
  transform-box: fill-box;
  animation: pejo-spin 1.3s cubic-bezier(0.45, 0, 0.55, 1) 1;
}

/* Meia-volta: no fim da animação ele fica de costas, e o segundo
   ciclo (disparado pelo mesmo clique) traz de volta a frente. */
.pejo-girando .pejo-frente {
  animation: pejo-frente 1.3s cubic-bezier(0.45, 0, 0.55, 1) 1 alternate;
}

.pejo-girando .pejo-costas {
  animation: pejo-costas 1.3s cubic-bezier(0.45, 0, 0.55, 1) 1 alternate;
}

/* Fora do giro, as costas ficam escondidas. */
.pejo-costas {
  opacity: 0;
}

.pejo-sad {
  animation: pejo-slump 0.5s ease-out forwards;
}

.pejo-eyes {
  transform-origin: center;
  transform-box: fill-box;
  animation: pejo-blink 5.5s ease-in-out infinite;
}

.pejo-pupilas {
  animation: pejo-olhar 7s ease-in-out infinite;
}

.pejo-antenna {
  transform-origin: center;
  transform-box: fill-box;
  animation: pejo-antenna 2s ease-in-out infinite;
}

.pejo-anel {
  transform-origin: center;
  transform-box: fill-box;
  animation: pejo-anel 3.4s ease-in-out infinite;
}

.pejo-wave {
  transform-origin: center;
  transform-box: fill-box;
  animation: pejo-talk 0.5s ease-in-out infinite;
}

.pejo-wave-2 {
  animation-delay: 0.12s;
}

.pejo-wave-3 {
  animation-delay: 0.24s;
}

/* Braços: a origem fica no topo (o ombro) pra girarem pendurados. */
.pejo-arm {
  transform-box: fill-box;
  transform-origin: 50% 12%;
  transition: transform 0.45s cubic-bezier(0.34, 1.3, 0.64, 1);
}

.pejo-arm-waving {
  animation: pejo-wave-arm 0.6s ease-in-out infinite;
}

/* Aponta pra tela do sistema, que fica acima do mascote. */
.pejo-arm-pointing {
  transform: rotate(-62deg);
}

.pejo-arm-sad {
  transform: rotate(14deg);
}

@media (prefers-reduced-motion: reduce) {
  .pejo-float,
  .pejo-sombra,
  .pejo-eyes,
  .pejo-pupilas,
  .pejo-antenna,
  .pejo-anel,
  .pejo-wave,
  .pejo-hop,
  .pejo-spin,
  .pejo-frente,
  .pejo-costas,
  .pejo-sad,
  .pejo-arm-waving {
    animation: none;
  }

  .pejo-arm {
    transition: none;
  }
}
